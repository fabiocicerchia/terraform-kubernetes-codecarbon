apiVersion: v1
kind: Namespace
metadata:
  name: codecarbon
  labels:
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: Secret
metadata:
  name: codecarbon-config
  namespace: codecarbon
type: Opaque
stringData:
  .codecarbon.config: |
    [codecarbon]
    api_endpoint = https://api.codecarbon.io
    organization_id =
    project_id =
    experiment_id =
    api_key =
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: codecarbon
  namespace: codecarbon
  labels:
    app.kubernetes.io/name: codecarbon
    app.kubernetes.io/instance: codecarbon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: codecarbon
      app.kubernetes.io/instance: codecarbon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codecarbon
        app.kubernetes.io/instance: codecarbon
    spec:
      # TRIVY FINDING: hostNetwork=true - Cannot be fixed
      # Reason: Required for CodeCarbon to access host network interfaces for accurate energy measurements
      hostNetwork: true
      # TRIVY FINDING: hostPID=true - Cannot be fixed
      # Reason: Required for CodeCarbon to access process information for carbon attribution
      hostPID: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: codecarbon
        image: fabiocicerchia/codecarbon:latest
        imagePullPolicy: IfNotPresent
        command:
        - codecarbon
        - monitor
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: codecarbon-config
          mountPath: /root/.codecarbon.config
          subPath: .codecarbon.config
          readOnly: true
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
        securityContext:
          # TRIVY FINDING: privileged=true - Cannot be fixed
          # Reason: Required for CodeCarbon to access hardware sensors (CPU, GPU, RAM) for energy measurements
          privileged: true
          # TRIVY FINDING: allowPrivilegeEscalation=true - Cannot be fixed
          # Reason: Implied by privileged=true, necessary for hardware access
          allowPrivilegeEscalation: true
          # TRIVY FINDING: runAsNonRoot=false - Cannot be fixed
          # Reason: Root access required to read hardware sensors and system metrics
          runAsNonRoot: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: codecarbon-config
        secret:
          secretName: codecarbon-config
          defaultMode: 0400
      # TRIVY FINDING: hostPath volumes - Cannot be fixed
      # Reason: CodeCarbon requires direct access to /proc and /sys for reading system metrics and hardware sensors
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
