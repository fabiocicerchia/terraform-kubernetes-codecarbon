name: code-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393  # v3.0.0
        with:
          # v4.0.0 renamed its release assets from ec-* to
          # editorconfig-checker-*, which this action cannot find.
          version: v3.11.3

      # The action above only installs the binary and adds it to PATH. Without
      # this step nothing is ever checked.
      - name: editorconfig
        run: editorconfig-checker

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        with:
          fail-on-error: true

      # The terraform_fmt hook shells out to a terraform binary, which the
      # runner does not ship. Without this the hook exits 127.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      # .pre-commit-config.yaml is the single definition of the file-level gate
      # (FC-GEN-047). This step is what the config file already claims runs it.
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
